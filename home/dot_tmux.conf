# Use Ctrl+A instead of the default Ctrl+B
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Don't show a message box when another window has activity
set -g visual-activity off

# Remove the delay after pressing Escape
set -sg escape-time 0

# Keep status messages and pane numbers on screen for 2 seconds
set -g display-time 2000
set -g display-panes-time 2000

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Rename windows automatically
set -g set-titles off
setw -g automatic-rename on

# Split panes: v = side by side, h = stacked
bind-key v split-window -h
bind-key h split-window -v

# Switch windows with Shift + Left/Right (no prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows with Prefix + < and > (repeatable)
bind-key -r < swap-window -t -1\; select-window -t -1
bind-key -r > swap-window -t +1\; select-window -t +1

# Clear scrollback history with Prefix + L
bind-key L clear-history

# Toggle synchronized input across panes with Prefix + y
bind-key y setw synchronize-panes\; display-message "synchronize mode toggled."

# Reload this config with Prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Status bar
set -g status-right '#(whoami) %I:%M'

# Use the terminal's background for the status bar
set -g status-style bg=default

# Show windows as index:name
set -g window-status-format "#I:#W"

# Highlight the current window
set -g window-status-current-format "#[fg=colour202]#I:#W"
